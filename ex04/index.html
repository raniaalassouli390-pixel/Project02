<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 04 - The Box Model</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="box content-box">
    <h3>content-box</h3>
    <p>Width (300px) + Padding + Border = Total Width expanded!</p>
  </div>

  <div class="box border-box">
    <h3>border-box</h3>
    <p>Width stays strictly 300px (Absorbs Padding and Border).</p>
  </div>
</body>
</html>
