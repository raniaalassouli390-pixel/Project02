<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 03 - Colors & Opacity</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Color Swatches</h2>
  <div class="palette">
    <div class="swatch named">Named Color</div>
    <div class="swatch hex">HEX (#0284c7)</div>
    <div class="swatch rgb">RGB (16, 185, 129)</div>
    <div class="swatch rgba">RGBA Transparency</div>
  </div>
  <h2>Opacity vs RGBA Comparison</h2>
  <div class="comparison-container">
    <div class="box opacity-box">
      <p>Opacity 0.5 (Fades text too)</p>
    </div>
    <div class="box rgba-box">
      <p>RGBA 0.5 (Text stays 100% solid)</p>
    </div>
  </div>

</body>
</html>
